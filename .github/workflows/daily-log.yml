name: Daily Dev Log

on:
  schedule:
    # 00:30 UTC = 6:00 AM IST
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create today's log
        run: |
          DATE=$(date -u +%Y-%m-%d)
          FILE="logs/${DATE}.md"

          mkdir -p logs

          if [ -f "$FILE" ]; then
            echo "Log already exists: $FILE"
            exit 0
          fi

          cat > "$FILE" << EOF
# Dev Log — ${DATE}

## What I learned today


## What I built / practiced


## Notes


EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git add logs/
          git commit -m "chore: add dev log for $(date -u +%Y-%m-%d)"
          git push
