name: Daily Dev Log

on:
  schedule:
    # 00:30 UTC = 6:00 AM IST
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Create today's log
        run: |
          DATE=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          TIME=$(TZ=Asia/Kolkata date +%H:%M)
          FILE="logs/${DATE}.md"

          mkdir -p logs

          if [ ! -f "$FILE" ]; then
            printf '%s\n' \
              "# Dev Log — ${DATE}" \
              "" \
              "_Automated daily log — ${TIME} IST_" \
              "" \
              "## What I learned today" \
              "" \
              "Daily check-in. Keeping the dev log streak going." \
              "" \
              "## What I built / practiced" \
              "" \
              "" \
              "## Notes" \
              "" \
              "" \
              > "$FILE"
          fi

      - name: Commit and push
        env:
          GIT_AUTHOR_NAME: Rushikesh Kolhe
          GIT_AUTHOR_EMAIL: kolherushikesh04@gmail.com
          GIT_COMMITTER_NAME: Rushikesh Kolhe
          GIT_COMMITTER_EMAIL: kolherushikesh04@gmail.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          DATE=$(TZ=Asia/Kolkata date +%Y-%m-%d)

          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add logs/
            git commit -m "log: ${DATE} (automated)"
          else
            git commit --allow-empty -m "log: ${DATE} (automated check-in)"
          fi

          git push
